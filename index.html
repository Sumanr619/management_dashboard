<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Test Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <section class="welcome-card">
        <p class="eyebrow">MANAGEMENT DASHBOARD</p>
        <h1>Everything looks on track.</h1>
        <p class="summary">A simple HTML and CSS page to verify the project setup.</p>
        <button type="button">View report</button>
      </section>

      <section class="metrics" aria-label="Key metrics">
        <article class="metric-card">
          <span>Active projects</span>
          <strong>12</strong>
          <small>+3 this month</small>
        </article>
        <article class="metric-card">
          <span>Team members</span>
          <strong>28</strong>
          <small>94% availability</small>
        </article>
        <article class="metric-card">
          <span>Tasks completed</span>
          <strong>86%</strong>
          <small>Up 8% this week</small>
        </article>
      </section>
    </main>
  </body>
</html>
